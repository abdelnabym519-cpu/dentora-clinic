name: Phase8 Lockfile Generator

on:
  push:
    branches:
      - phase/devops-phase-8-final-proof

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Regenerate lockfile metadata only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove npm ci accepts generated lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile only
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "lockfile already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'chore(devops): synchronize frontend package lock'
          git push origin HEAD:phase/devops-phase-8-final-proof
