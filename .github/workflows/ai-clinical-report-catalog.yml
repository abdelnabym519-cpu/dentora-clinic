name: AI Clinical Report Validation Helper

on:
  push:
    branches:
      - phase/ai-clinical-report

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/ai-clinical-report
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Apply official Ruff fixes and formatter to stage files
        run: |
          ruff check --fix backend/app/modules/ai_clinical_report backend/tests/test_ai_clinical_report.py
          ruff format backend/app/modules/ai_clinical_report backend/tests/test_ai_clinical_report.py
      - name: Run focused stage and manifest tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: validation-helper-key
          ENVIRONMENT: test
          TESTING: 'true'
        run: |
          python -m pytest tests/test_ai_clinical_report.py \
                           tests/test_module_manifest.py \
                           tests/test_module_manifests_consistency.py \
                           tests/test_manifest_validator.py \
                           tests/test_module_loader.py \
                           tests/test_module_docs.py \
                           -v --tb=short
      - name: Run strict docs coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: validation-helper-key
          ENVIRONMENT: test
          TESTING: 'true'
        run: python scripts/check_docs_coverage.py --strict
      - name: Run official catalog generator
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: validation-helper-key
          ENVIRONMENT: test
          TESTING: 'true'
        run: python scripts/generate_catalogs.py
      - name: Commit formatter and generated catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/ai_clinical_report backend/tests/test_ai_clinical_report.py docs/modules-catalog.md docs/events-catalog.md
          if git diff --cached --quiet; then
            echo 'Stage files already canonical'
            exit 0
          fi
          git commit -m 'chore: normalize AI clinical report validation outputs'
          git push origin HEAD:phase/ai-clinical-report
