name: Apply Closure Patch

on:
  push:
    branches: [phase/arabic-rtl-final-ui]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/arabic-rtl-final-ui
      - name: Apply canonical type contract fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  return
              p.write_text(text.replace(old, new))

          types = 'frontend/app/types/index.ts'

          # API response arrays are read-only to Vue template consumers. Model
          # response types accordingly rather than casting DeepReadonly values.
          replace(types,
              "  tooth_number?: number\n  surfaces?: string[]\n  is_global: boolean",
              "  tooth_number?: number\n  surfaces?: readonly string[]\n  is_global: boolean")
          replace(types,
              "  treatments?: AppointmentTreatmentBrief[] // New: treatments from catalog",
              "  treatments?: readonly AppointmentTreatmentBrief[] // New: treatments from catalog")
          replace(types,
              "  history?: AppointmentStatusEvent[] | null\n  cabinet_history?: AppointmentCabinetEvent[] | null",
              "  history?: readonly AppointmentStatusEvent[] | null\n  cabinet_history?: readonly AppointmentCabinetEvent[] | null")
          replace(types,
              "  // Dental specifics\n  tooth_number?: number\n  surfaces?: string[]",
              "  // Dental specifics\n  tooth_number?: number\n  surfaces?: readonly string[]")
          replace(types,
              "  // Dental context\n  tooth_number?: number\n  surfaces?: string[]\n  // Display",
              "  // Dental context\n  tooth_number?: number\n  surfaces?: readonly string[]\n  // Display")

          # Billing owns an enriched PatientBrief; the generic patient-module
          # brief intentionally does not contain billing snapshot fields.
          patient_brief = """export interface PatientBrief {\n  id: string\n  first_name: string\n  last_name: string\n  phone?: string\n  email?: string\n}\n"""
          billing_brief = patient_brief + """\nexport interface BillingPatientBrief extends PatientBrief {\n  billing_name?: string | null\n  billing_tax_id?: string | null\n  billing_address?: BillingAddress | null\n  billing_email?: string | null\n  has_complete_billing_info: boolean\n}\n"""
          replace(types, patient_brief, billing_brief)
          replace(types,
              "  billing_name: string\n  billing_tax_id?: string\n  billing_address?: BillingAddress\n  billing_email?: string",
              "  billing_name: string | null\n  billing_tax_id: string | null\n  billing_address: BillingAddress | null\n  billing_email: string | null")
          replace(types,
              "  // Related\n  patient?: PatientBrief\n  creator?: UserBrief\n  issuer?: UserBrief\n  budget?: BudgetBrief\n  credit_note_for?: InvoiceBrief",
              "  // Related\n  patient?: BillingPatientBrief\n  creator?: UserBrief\n  issuer?: UserBrief\n  budget?: BudgetBrief\n  credit_note_for?: InvoiceBrief")
          replace(types,
              "  compliance_data?: Record<string, Record<string, unknown>> | null\n  patient?: PatientBrief\n  creator?: UserBrief",
              "  compliance_data?: Record<string, Record<string, unknown>> | null\n  patient?: BillingPatientBrief\n  creator?: UserBrief")
          replace(types,
              "export interface InvoiceDetail extends Invoice {\n  items: InvoiceItem[]\n  payments: Payment[]\n}",
              "export interface InvoiceDetail extends Invoice {\n  items: readonly InvoiceItem[]\n  invoice_payments: readonly InvoicePayment[]\n}")

          # Treatment-plan statuses and closure metadata follow the backend
          # model/workflow (draft -> pending -> active -> completed -> archived,
          # with closed as the terminal non-completed state).
          replace(types,
              "export type TreatmentPlanStatus = 'draft' | 'active' | 'completed' | 'archived' | 'cancelled'",
              "export type TreatmentPlanStatus = 'draft' | 'pending' | 'active' | 'completed' | 'archived' | 'closed'")
          replace(types,
              "  status: TreatmentPlanStatus\n  budget_id?: string",
              "  status: TreatmentPlanStatus\n  closure_reason?: 'rejected_by_patient' | 'expired' | 'cancelled_by_clinic' | 'patient_abandoned' | 'other' | null\n  closed_at?: string | null\n  confirmed_at?: string | null\n  budget_id?: string")

          # Agenda nullability/readonly contract fixes.
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentCalendar.vue',
              '  appointments: Appointment[]', '  appointments: readonly Appointment[]')
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentCalendar.vue',
              'function getCabinetColor(cabinetName: string): string {',
              'function getCabinetColor(cabinetName: string | null | undefined): string {')
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentDailyView.vue',
              '  appointments: Appointment[]', '  appointments: readonly Appointment[]')
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentKanbanView.vue',
              '  appointments: Appointment[]', '  appointments: readonly Appointment[]')
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentModal.vue',
              '  existingAppointments?: Appointment[]', '  existingAppointments?: readonly Appointment[]')
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentModal.vue',
              "            : undefined,\n        media: []\n      }))",
              "            : undefined\n      }))")
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentMobileDaySummary.vue',
              "t('appointments.freeSlots.nextFreeAt', 'Próximo {time}', {\n            time: formatNextFreeTime(summary.nextFreeStart)\n          })",
              "t('appointments.freeSlots.nextFreeAt', {\n            time: formatNextFreeTime(summary.nextFreeStart)\n          })")
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentMobileDaySummary.vue',
              "t('appointments.freeSlots.gapsAtLeast', '{count} huecos ≥ {min} min', {\n            count: summary.qualifyingGapsCount,\n            min: minDurationMin\n          })",
              "t('appointments.freeSlots.gapsAtLeast', {\n            count: summary.qualifyingGapsCount,\n            min: minDurationMin\n          })")
          replace('backend/app/modules/agenda/frontend/components/clinical/AppointmentMobileTimeline.vue',
              "  return t(\n    'appointments.freeSlots.tapToBookAria',\n    'Hueco libre de {duration} a las {time}',\n    { duration: formatDuration(e.durationMin), time: formatTime(e.start) }\n  )",
              "  return t(\n    'appointments.freeSlots.tapToBookAria',\n    { duration: formatDuration(e.durationMin), time: formatTime(e.start) }\n  )")

          # Billing: invoice-payment links are not full Payment records. Resolve
          # their payment_id via the payments module before rendering method/date.
          path = 'backend/app/modules/billing/frontend/components/clinical/PatientBillingSummary.vue'
          replace(path,
              "import type { PatientBillingSummary, InvoiceListItem, PaginatedResponse, Payment } from '~~/app/types'",
              "import type { ApiResponse, PatientBillingSummary, InvoiceListItem, PaginatedResponse, Payment } from '~~/app/types'")
          replace(path,
              "        const payments = await fetchPayments(invoiceId)\n        invoicePayments.value.set(invoiceId, payments)",
              "        const links = await fetchPayments(invoiceId)\n        const payments = await Promise.all(links.map(async (link) => {\n          const response = await api.get<ApiResponse<Payment>>(`/api/v1/payments/${link.payment_id}`)\n          return response.data\n        }))\n        invoicePayments.value.set(invoiceId, payments)")

          path = 'backend/app/modules/billing/frontend/pages/invoices/from-budget/[budgetId].vue'
          replace(path,
              "function getVatType(vatTypeId?: string): VatType | undefined {\n  return vatTypes.value.find(v => v.id === vatTypeId)\n}\n",
              "function getVatType(vatTypeId?: string): VatType | undefined {\n  return vatTypes.value.find(v => v.id === vatTypeId)\n}\n\nfunction getCatalogItemName(item: BudgetItem): string {\n  const names = item.catalog_item?.names\n  if (!names) return item.catalog_item?.internal_code || ''\n  return names[locale.value] || names.es || names.en || Object.values(names)[0] || item.catalog_item?.internal_code || ''\n}\n")
          replace(path,
              "{{ item.catalog_item?.name || 'Tratamiento' }}",
              "{{ getCatalogItemName(item) }}")

          path = 'backend/app/modules/billing/frontend/pages/invoices/new.vue'
          replace(path,
              "      form.value.billing_address = { ...patient.billing_address }",
              "      form.value.billing_address = {\n        street: patient.billing_address.street || '',\n        city: patient.billing_address.city || '',\n        postal_code: patient.billing_address.postal_code || '',\n        province: patient.billing_address.province || '',\n        country: patient.billing_address.country || 'ES'\n      }")
          replace(path,
              "      patient_id: form.value.patient_id,\n      billing_name: form.value.billing_name || undefined,\n      billing_tax_id: form.value.billing_tax_id || undefined,\n      billing_email: form.value.billing_email || undefined,\n      billing_address: form.value.billing_address.street ? form.value.billing_address : undefined,\n      payment_term_days: form.value.payment_term_days,",
              "      patient_id: form.value.patient_id,\n      payment_term_days: form.value.payment_term_days,")

          # Root odontogram constants still referenced retired bridge tooth
          # conditions and pre-taxonomy treatment names.
          path = 'frontend/app/constants/odontogram.ts'
          replace(path,
              "  implant: '#10B981',\n  bridge_pontic: '#F97316',\n  bridge_abutment: '#FBBF24',\n  extraction_indicated: '#DC2626',",
              "  implant: '#10B981',\n  extraction_indicated: '#DC2626',")
          replace(path,
              "  2: 'filling',\n  3: 'root_canal',",
              "  2: 'filling_composite',\n  3: 'root_canal_full',")
          PY

          git diff --check
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app backend/app/modules
          git commit -m "fix(frontend): align canonical domain type contracts"
          git push origin HEAD:phase/arabic-rtl-final-ui
