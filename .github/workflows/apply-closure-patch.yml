name: Apply Closure Patch

on:
  push:
    branches: [phase/arabic-rtl-final-ui]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/arabic-rtl-final-ui
      - name: Apply pending closure patch
        shell: bash
        run: |
          if [ ! -f .github/closure-fix.patch ]; then
            echo "No pending closure patch"
            exit 0
          fi
          git apply --check .github/closure-fix.patch
          git apply .github/closure-fix.patch
          rm .github/closure-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(frontend): resolve closure typecheck blockers"
          git push origin HEAD:phase/arabic-rtl-final-ui
