name: Apply Auto Update Consumer Contract Fix

on:
  push:
    branches: ["ops/auto-update-production-validation"]
    paths: [".github/workflows/auto-update-apply-consumer-contract-fix.yml"]

permissions:
  contents: write

env:
  EXPECTED_RELEASE_SHA: 4c55baa7884a559c05b592c73a2e3f33eb32166c
  RELEASE_BRANCH: release/v2.0.1

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guarded release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Patch secure release-image normalization
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_RELEASE_SHA" ]] || { echo "::error::Expected $EXPECTED_RELEASE_SHA, got $actual"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/client-update.ps1')
          text = path.read_text(encoding='utf-8')
          anchor = '''function Assert-ImmutableImageReference([string]$Reference, [string]$Repository, [string]$ImageName) {
              $prefix = [regex]::Escape("ghcr.io/$Repository-$ImageName@sha256:")
              if ($Reference -notmatch "^${prefix}[a-f0-9]{64}$") {
                  throw "Release image is not an authorized immutable GHCR digest: $Reference"
              }
          }
          '''
          replacement = anchor + '''function Convert-ReleaseImageReference([string]$Reference, [string]$Repository, [string]$ImageName, [string]$Version) {
              $base = "ghcr.io/$Repository-$ImageName"
              $digestOnly = "^$([regex]::Escape("$base@sha256:"))([a-f0-9]{64})$"
              $tagged = "^$([regex]::Escape("${base}:$Version@sha256:"))([a-f0-9]{64})$"
              if ($Reference -match $digestOnly) {
                  $normalized = $Reference
              } elseif ($Reference -match $tagged) {
                  $normalized = "$base@sha256:$($matches[1])"
              } else {
                  throw "Release image is not an authorized immutable GHCR digest for version $Version: $Reference"
              }
              Assert-ImmutableImageReference $normalized $Repository $ImageName
              return $normalized
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one immutable-reference anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          old = '''    Assert-ImmutableImageReference ([string]$Json.images.backend) $Repository 'backend'
              Assert-ImmutableImageReference ([string]$Json.images.frontend) $Repository 'frontend'
          '''
          new = '''    $version = [string]$Json.version
              $Json.images.backend = Convert-ReleaseImageReference ([string]$Json.images.backend) $Repository 'backend' $version
              $Json.images.frontend = Convert-ReleaseImageReference ([string]$Json.images.frontend) $Repository 'frontend' $version
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one manifest image-validation block, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/client-update.ps1

      - name: Execute focused security contract tests
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'scripts/client-update.ps1').Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'PowerShell parse failure.' }
          $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) |
            ForEach-Object { Invoke-Expression $_.Extent.Text }

          function Expect-Throw([string]$Name, [scriptblock]$Action) {
            try { & $Action; throw "$Name unexpectedly passed" }
            catch {
              if ($_.Exception.Message -eq "$Name unexpectedly passed") { throw }
              Write-Host "$Name rejected: $($_.Exception.Message)"
            }
          }

          $repo = 'abdelnabym519-cpu/dentora-clinic'
          $digest = 'a' * 64
          $release = [pscustomobject]@{ tag_name='v2.0.1'; draft=$false; prerelease=$false; assets=@() }
          $tagged = [pscustomobject]@{
            schema=1; version='2.0.1'; tag='v2.0.1';
            images=[pscustomobject]@{
              backend="ghcr.io/${repo}-backend:2.0.1@sha256:$digest"
              frontend="ghcr.io/${repo}-frontend:2.0.1@sha256:$digest"
            }
          }
          Assert-ReleaseManifest $tagged $release $repo
          $expectedBackend = "ghcr.io/${repo}-backend@sha256:$digest"
          $expectedFrontend = "ghcr.io/${repo}-frontend@sha256:$digest"
          if ($tagged.images.backend -ne $expectedBackend -or $tagged.images.frontend -ne $expectedFrontend) {
            throw 'Published tag@digest references were not normalized to digest-only.'
          }

          $digestOnly = [pscustomobject]@{
            schema=1; version='2.0.1'; tag='v2.0.1';
            images=[pscustomobject]@{ backend=$expectedBackend; frontend=$expectedFrontend }
          }
          Assert-ReleaseManifest $digestOnly $release $repo
          if ($digestOnly.images.backend -ne $expectedBackend -or $digestOnly.images.frontend -ne $expectedFrontend) {
            throw 'Digest-only manifest was modified unexpectedly.'
          }

          $wrongVersion = [pscustomobject]@{
            schema=1; version='2.0.1'; tag='v2.0.1';
            images=[pscustomobject]@{
              backend="ghcr.io/${repo}-backend:2.0.0@sha256:$digest"
              frontend=$expectedFrontend
            }
          }
          Expect-Throw 'wrong image tag' { Assert-ReleaseManifest $wrongVersion $release $repo }
          Expect-Throw 'mutable image' { Convert-ReleaseImageReference "ghcr.io/${repo}-backend:2.0.1" $repo 'backend' '2.0.1' | Out-Null }
          Expect-Throw 'wrong repository' { Convert-ReleaseImageReference "ghcr.io/attacker/dentora-clinic-backend:2.0.1@sha256:$digest" $repo 'backend' '2.0.1' | Out-Null }
          Write-Host 'Focused updater manifest contract tests passed.'

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/client-update.ps1
          git commit -m 'fix: normalize version-tagged release digests'
          git push origin HEAD:${RELEASE_BRANCH}
          echo "Pushed $(git rev-parse HEAD) to ${RELEASE_BRANCH}"
