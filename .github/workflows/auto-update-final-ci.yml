name: Auto Update Final CI

on:
  push:
    branches: ["ops/auto-update-production-validation"]
    paths: [".github/workflows/auto-update-final-ci.yml"]

permissions:
  contents: read

env:
  TARGET_SHA: c4fc7b0c9000e6e10f6f363a2cb70d5d06acc44f

jobs:
  core-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - name: Checkout exact final SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Backend lint and format
        run: |
          pip install ruff
          ruff check backend/
          ruff format --check backend/

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Backend tests default set
        working-directory: backend
        run: python -m pytest -v --tb=short

      - name: Alembic round-trip
        working-directory: backend
        run: python -m pytest -v -m alembic_roundtrip --tb=short

      - name: Manifest consistency
        working-directory: backend
        run: |
          python -m pytest tests/test_module_manifest.py \
                           tests/test_module_manifests_consistency.py \
                           tests/test_manifest_validator.py \
                           tests/test_module_loader.py \
                           tests/test_module_docs.py \
                           -v --tb=short

      - name: Catalog freshness and strict docs coverage
        working-directory: backend
        run: |
          python scripts/generate_catalogs.py --check
          python scripts/check_docs_coverage.py --strict

      - name: Docs layout
        run: python scripts/check_docs_layout.py

      - name: Docs portal build
        working-directory: docs/portal
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f .vitepress/dist/index.html

      - name: Frontend install
        working-directory: frontend
        run: npm install

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend type preparation
        working-directory: frontend
        run: |
          echo '{"layers":[],"modules":[],"version":1}' > modules.json
          npx nuxi prepare

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: testpass
      SECRET_KEY: ci-secret-key-for-e2e
    steps:
      - name: Checkout exact final SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Prove checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SECRET_KEY=${SECRET_KEY}
          ENVIRONMENT=development
          EOF

      - name: Boot db + backend
        run: docker compose up -d db backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8100/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready on port 8100"
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Run migrations
        run: docker compose exec -T backend alembic upgrade heads

      - name: Seed demo data
        run: ./scripts/seed-demo.sh --lang es

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install frontend deps + Playwright browsers
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate modules.json with host paths
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          modules_dir = root / "backend/app/modules"
          entries = []
          for m in sorted(modules_dir.iterdir()):
              layer = m / "frontend"
              if layer.is_dir():
                  entries.append({"name": m.name, "path": str(layer.resolve())})
          Path("modules.json").write_text(
              json.dumps(
                  {"layers": [e["path"] for e in entries], "modules": entries, "version": 1},
                  indent=2,
              )
          )
          PY
          cat modules.json

      - name: Start Nuxt dev in background
        working-directory: frontend
        env:
          E2E_LOCALE: en
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
          API_BASE_URL_SERVER: http://127.0.0.1:8100
          NITRO_HOST: 0.0.0.0
          NITRO_PORT: "3000"
        run: |
          nohup npm run dev > /tmp/nuxt.log 2>&1 &
          echo "nuxt started (pid $!)"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 120); do
            if [ "$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/login)" = "200" ]; then
              echo "frontend ready"; break
            fi
            sleep 2
          done
          curl -sf -o /dev/null -w "final status: %{http_code}\n" http://localhost:3000/login

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_API_BASE: http://127.0.0.1:8100
        run: npx playwright test --reporter=list

      - name: Upload Nuxt log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: final-ci-nuxt-dev-log
          path: /tmp/nuxt.log
          retention-days: 7

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: final-ci-playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: final-ci-playwright-test-results
          path: frontend/test-results
          retention-days: 7
