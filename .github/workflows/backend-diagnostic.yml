name: Backend Diagnostic

on:
  push:
    branches: [codex/auto-scaling-foundation]

jobs:
  backend-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      TESTING: "true"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies and timeout diagnostics
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install pytest-timeout
      - name: Run backend tests with per-test deadlock detection
        working-directory: backend
        run: python -m pytest -vv --tb=short --timeout=180 --timeout-method=signal
