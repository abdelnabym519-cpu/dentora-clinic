name: Case Intelligence Catalog Autofix

on:
  push:
    branches:
      - codex/phase-5-dentora

permissions:
  contents: write

jobs:
  regenerate-catalogs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Regenerate catalogs
        working-directory: backend
        run: python scripts/generate_catalogs.py
      - name: Commit generated catalogs
        run: |
          if git diff --quiet -- docs/modules-catalog.md docs/events-catalog.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs(case-intelligence): regenerate catalogs"
          git push origin HEAD:codex/phase-5-dentora
