name: Catalog Export Diagnostic

on:
  push:
    branches:
      - arena/electronic-prescription

permissions:
  contents: write

jobs:
  generate-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/electronic-prescription

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Generate catalogs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py

      - name: Commit generated catalogs and remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/catalog-export.yml
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs(catalog): regenerate module catalog"
          git push origin HEAD:arena/electronic-prescription
