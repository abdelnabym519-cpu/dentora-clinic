name: Catalog Export Diagnostic

on:
  push:
    branches:
      - arena/electronic-prescription

permissions:
  contents: read

jobs:
  generate-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Generate catalogs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py

      - name: Upload generated catalogs
        uses: actions/upload-artifact@v5
        with:
          name: generated-catalogs
          path: |
            docs/modules-catalog.md
            docs/events-catalog.md
          retention-days: 1
