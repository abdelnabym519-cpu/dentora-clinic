name: CI

on:
  push:
    branches: [codex/scalable-media-storage]

permissions:
  contents: write

jobs:
  regenerate-scalable-storage-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/scalable-media-storage
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Regenerate catalogs with official generator
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py
      - name: Commit generated catalogs only
        run: |
          git add docs/modules-catalog.md docs/events-catalog.md
          if git diff --cached --quiet; then
            echo "Catalogs already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate generated catalogs"
          git push origin HEAD:codex/scalable-media-storage
