name: Clinical Copilot catalog regeneration

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  regenerate-catalogs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://stub:stub@localhost:5432/stub
      SECRET_KEY: catalog-generator-stub-key-32chars-minimum
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerate catalogs with official generator
        run: python backend/scripts/generate_catalogs.py

      - name: Commit generated catalogs when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/modules-catalog.md docs/events-catalog.md; then
            echo "Catalogs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs: regenerate catalogs for Clinical Copilot"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
