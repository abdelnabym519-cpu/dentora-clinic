name: Clinical Copilot Focused Validation

on:
  push:
    branches:
      - phase/clinical-copilot
    paths:
      - .github/workflows/clinical-copilot-focused.yml
      - backend/app/modules/clinical_copilot/**
      - backend/tests/modules/clinical_copilot/**

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
      SECRET_KEY: focused-validation-secret
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run focused Clinical Copilot tests
        working-directory: backend
        run: python -m pytest tests/modules/clinical_copilot -v --tb=short

      - name: Run focused Ruff check
        run: ruff check backend/app/modules/clinical_copilot backend/tests/modules/clinical_copilot

      - name: Run focused Ruff format check
        run: ruff format --check backend/app/modules/clinical_copilot backend/tests/modules/clinical_copilot
