name: Clinical Copilot Ruff Format

on:
  push:
    branches:
      - phase/clinical-copilot
    paths:
      - .github/workflows/clinical-copilot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/clinical-copilot
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply Ruff formatter
        run: |
          pip install ruff==0.16.4
          ruff format backend/
          ruff check backend/
          git diff --check

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          git commit -m "style: apply Ruff formatting for Clinical Copilot"
          git push origin HEAD:phase/clinical-copilot
