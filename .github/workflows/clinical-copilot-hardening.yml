name: Clinical Copilot Hardening Apply

on:
  push:
    branches:
      - phase/clinical-copilot
    paths:
      - .github/workflows/clinical-copilot-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/clinical-copilot
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply finite-focus, alias, and provenance hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts_path = Path("backend/app/modules/clinical_copilot/contracts.py")
          contracts = contracts_path.read_text()
          contracts = contracts.replace("from typing import Any, Literal", "from typing import Any")
          contracts = contracts.replace(
              'CLINICAL_COPILOT_CONTRACT_VERSION = "1.0"\n',
              'CLINICAL_COPILOT_CONTRACT_VERSION = "1.0"\n'
              'CLINICAL_COPILOT_INPUT_VERSION = "1.0"\n'
              'CLINICAL_COPILOT_PROMPT_VERSION = "1.0"\n'
              'PROVIDER_CONTRACT_VERSION = "core.llm.Provider/1"\n',
              1,
          )
          stage_marker = '''class StageState(StrEnum):
              READY = "ready"
              MISSING = "missing"
              STALE = "stale"
              UNAVAILABLE = "unavailable"
          '''
          focus_block = stage_marker + '''

          class ClinicalCopilotFocus(StrEnum):
              """Finite advisory intent; arbitrary clinical free text is never accepted."""

              CASE_REVIEW = "case_review"
              RISK_CONTEXT = "risk_context"
              TREATMENT_OPTIONS = "treatment_options"
              SIMULATION_CONTEXT = "simulation_context"
              SECOND_REVIEW = "second_review"
          '''
          if "class ClinicalCopilotFocus" not in contracts:
              assert stage_marker in contracts
              contracts = contracts.replace(stage_marker, focus_block, 1)
          old_ask = '''class ClinicalCopilotAsk(BaseModel):
              """Finite intent only; unrestricted clinical free text never crosses the provider boundary."""

              model_config = ConfigDict(extra="forbid")

              patient_id: UUID
              focus: Literal[
                  "case_review",
                  "risk_context",
                  "treatment_options",
                  "simulation_context",
                  "second_review",
              ] = "case_review"
          '''
          new_ask = '''class ClinicalCopilotAsk(BaseModel):
              """Finite intent only; unrestricted clinical free text never crosses the provider boundary."""

              model_config = ConfigDict(extra="forbid")

              patient_id: UUID
              focus: ClinicalCopilotFocus = ClinicalCopilotFocus.CASE_REVIEW
          '''
          assert old_ask in contracts
          contracts = contracts.replace(old_ask, new_ask, 1)
          old_prov = '''    provider: str
              model: str
              contract_version: str = CLINICAL_COPILOT_CONTRACT_VERSION
              input_digest: str
          '''
          new_prov = '''    provider: str
              model: str
              provider_contract_version: str = PROVIDER_CONTRACT_VERSION
              prompt_version: str = CLINICAL_COPILOT_PROMPT_VERSION
              input_contract_version: str = CLINICAL_COPILOT_INPUT_VERSION
              contract_version: str = CLINICAL_COPILOT_CONTRACT_VERSION
              input_digest: str
          '''
          assert old_prov in contracts
          contracts = contracts.replace(old_prov, new_prov, 1)
          contracts_path.write_text(contracts)

          service_path = Path("backend/app/modules/clinical_copilot/service.py")
          service = service_path.read_text()
          old_import = '''from .contracts import (
              AdvisoryClaim,
              ClinicalCopilotAdvisory,
              ClinicalCopilotContext,
              ClinicalCopilotProvenance,
              ClinicalStageStatus,
              StageName,
              StageState,
          )'''
          new_import = '''from .contracts import (
              CLINICAL_COPILOT_INPUT_VERSION,
              AdvisoryClaim,
              ClinicalCopilotAdvisory,
              ClinicalCopilotContext,
              ClinicalCopilotFocus,
              ClinicalCopilotProvenance,
              ClinicalStageStatus,
              StageName,
              StageState,
          )'''
          assert old_import in service
          service = service.replace(old_import, new_import, 1)
          output_error = '''class ClinicalCopilotOutputError(ValueError):
              pass
          '''
          input_and_output = '''class ClinicalCopilotInputError(ValueError):
              pass


          class ClinicalCopilotOutputError(ValueError):
              pass
          '''
          assert output_error in service
          service = service.replace(output_error, input_and_output, 1)
          helper_marker = '''def _availability_state(availability: Any, missing_report: Any) -> tuple[StageState, str | None]:
          '''
          alias_helpers = '''_EVIDENCE_SCALAR_KEYS = {"evidence_id"}
          _EVIDENCE_LIST_KEYS = {"evidence_ids", "evidence_refs"}
          _PROVIDER_PRIVATE_KEYS = {
              "artifact_id",
              "clinic_id",
              "patient_id",
              "planning_id",
              "simulation_id",
              "source_record_id",
              "source_digest",
              "input_digest",
              "result_digest",
              "output_digest",
          }


          def _evidence_aliases(evidence_ids: set[str]) -> tuple[dict[str, str], dict[str, str]]:
              real_to_alias = {
                  evidence_id: f"E{index:03d}"
                  for index, evidence_id in enumerate(sorted(evidence_ids), start=1)
              }
              return real_to_alias, {alias: real for real, alias in real_to_alias.items()}


          def _provider_projection(value: Any, aliases: dict[str, str], *, key: str | None = None) -> Any:
              """Strip internal provenance identifiers and alias provider-visible evidence refs."""
              if isinstance(value, dict):
                  projected: dict[str, Any] = {}
                  for raw_key, item in value.items():
                      current_key = str(raw_key)
                      lowered = current_key.lower()
                      if lowered in _PROVIDER_PRIVATE_KEYS or lowered.endswith("_digest"):
                          continue
                      projected[current_key] = _provider_projection(item, aliases, key=lowered)
                  return projected
              if isinstance(value, list):
                  if key in _EVIDENCE_LIST_KEYS:
                      return [aliases[str(item)] for item in value if str(item) in aliases]
                  return [_provider_projection(item, aliases, key=key) for item in value]
              if key in _EVIDENCE_SCALAR_KEYS and value is not None:
                  return aliases.get(str(value))
              return value


          '''
          assert helper_marker in service
          service = service.replace(helper_marker, alias_helpers + helper_marker, 1)
          advise_start = service.index("    async def advise(")
          advise = '''    async def advise(
              self,
              *,
              clinic_id: UUID,
              patient_id: UUID,
              focus: ClinicalCopilotFocus,
              provider: Provider,
              provider_name: str,
              model: str,
              user_id: UUID,
              user_role: str,
          ) -> ClinicalCopilotAdvisory:
              if user_role != "dentist":
                  raise PermissionError("dentist_control_required")
              if not isinstance(focus, ClinicalCopilotFocus):
                  try:
                      focus = ClinicalCopilotFocus(focus)
                  except (TypeError, ValueError) as exc:
                      raise ClinicalCopilotInputError("clinical_copilot_focus_invalid") from exc

              redactor = Redactor(enabled=True)
              context = await self.build_context(
                  clinic_id=clinic_id,
                  patient_id=patient_id,
                  redactor=redactor,
              )
              if not context.ready_for_advice:
                  raise ClinicalContextInsufficientError(context)

              allowed_ids = {ref for stage in context.stages for ref in stage.evidence_refs if ref}
              real_to_alias, alias_to_real = _evidence_aliases(allowed_ids)
              provider_payload = _redact_structured(
                  {
                      "input_contract_version": CLINICAL_COPILOT_INPUT_VERSION,
                      "contract_version": context.contract_version,
                      "focus": focus.value,
                      "evidence_chain": _provider_projection(context.evidence_catalog, real_to_alias),
                      "allowed_evidence_ids": sorted(alias_to_real),
                      "missing_or_stale": context.missing_or_stale,
                  },
                  redactor=redactor,
              )
              system = (
                  "You are Dentora Clinical Copilot. You are advisory only. Never diagnose, approve, "
                  "select, prescribe, or autonomously decide treatment. Use only supplied structured "
                  "evidence. Never infer missing facts. Every claim must cite one or more aliases from "
                  "allowed_evidence_ids. Dentist review and control are mandatory. Return JSON only: "
                  '{"claims":[{"text":"...","evidence_ids":["E001"]}],"limitations":["..."]}.'
              )
              messages = [
                  ProviderMessage(role=Role.USER, content=[TextBlock(text=_canonical(provider_payload))])
              ]
              messages = redactor.redact_outgoing(messages)
              provider_input_payload = json.loads(messages[0].content[0].text)
              provider_input_digest = _digest(provider_input_payload)

              chunks: list[str] = []
              async for event in provider.complete(
                  system=system,
                  messages=messages,
                  tools=[],
                  model=model,
                  max_tokens=1200,
              ):
                  if isinstance(event, TextDelta):
                      chunks.append(event.text)
                  elif isinstance(event, ToolUse):
                      raise ClinicalCopilotOutputError("clinical_copilot_tool_use_forbidden")
                  elif isinstance(event, Done):
                      break

              try:
                  raw = json.loads("".join(chunks))
                  if set(raw) - {"claims", "limitations"}:
                      raise ClinicalCopilotOutputError("clinical_copilot_invalid_provider_output")
                  provider_claims = [
                      AdvisoryClaim.model_validate(item) for item in raw.get("claims", [])
                  ]
                  limitations = [str(item) for item in raw.get("limitations", [])]
              except (json.JSONDecodeError, TypeError, ValidationError) as exc:
                  raise ClinicalCopilotOutputError("clinical_copilot_invalid_provider_output") from exc

              if not provider_claims:
                  raise ClinicalCopilotOutputError("clinical_copilot_claims_required")
              unsupported = {
                  evidence_id
                  for claim in provider_claims
                  for evidence_id in claim.evidence_ids
                  if evidence_id not in alias_to_real
              }
              if unsupported:
                  raise ClinicalCopilotOutputError("clinical_copilot_unsupported_evidence_reference")

              claims = [
                  AdvisoryClaim(
                      text=claim.text,
                      evidence_ids=[
                          redactor.rehydrate(alias_to_real[evidence_id])
                          for evidence_id in claim.evidence_ids
                      ],
                  )
                  for claim in provider_claims
              ]
              output_payload = {
                  "claims": [claim.model_dump(mode="json") for claim in provider_claims],
                  "limitations": limitations,
              }
              return ClinicalCopilotAdvisory(
                  patient_id=patient_id,
                  claims=claims,
                  limitations=limitations,
                  provenance=ClinicalCopilotProvenance(
                      provider=provider_name,
                      model=model,
                      input_digest=provider_input_digest,
                      output_digest=_digest(output_payload),
                      upstream=context.stages,
                      generated_at=datetime.now(UTC),
                      generated_by=user_id,
                  ),
              )
          '''
          service = service[:advise_start] + advise
          service_path.write_text(service)

          test_path = Path("backend/tests/modules/clinical_copilot/test_service.py")
          tests = test_path.read_text()
          old_provider = '''        self.last_user_text = messages[0].content[0].text
              self.tools = tools

              async def stream():
                  if self.tool_use:
                      yield ToolUse(id="call-1", name="write_record", input={})
                      return
                  yield TextDelta(text=json.dumps(self.payload))
          '''
          new_provider = '''        self.last_user_text = messages[0].content[0].text
              self.tools = tools
              provider_payload = json.loads(self.last_user_text)
              response_payload = self.payload(provider_payload) if callable(self.payload) else self.payload

              async def stream():
                  if self.tool_use:
                      yield ToolUse(id="call-1", name="write_record", input={})
                      return
                  yield TextDelta(text=json.dumps(response_payload))
          '''
          assert old_provider in tests
          tests = tests.replace(old_provider, new_provider, 1)
          old_grounded = '''    provider = FakeProvider(
                  {
                      "claims": [{"text": "Review the simulated option.", "evidence_ids": ["SIM-1"]}],
                      "limitations": [],
                  }
              )
          '''
          new_grounded = '''    provider = FakeProvider(
                  lambda payload: {
                      "claims": [
                          {
                              "text": "Review the simulated option.",
                              "evidence_ids": [payload["allowed_evidence_ids"][-1]],
                          }
                      ],
                      "limitations": [],
                  }
              )
          '''
          assert old_grounded in tests
          tests = tests.replace(old_grounded, new_grounded, 1)
          test_path.write_text(tests)

          hardening_test = Path("backend/tests/modules/clinical_copilot/test_hardening.py")
          hardening_test.write_text('''from __future__ import annotations

          import json
          from uuid import uuid4

          import pytest

          from app.core.llm.base import Done, TextDelta
          from app.modules.clinical_copilot.contracts import (
              ClinicalCopilotContext,
              ClinicalCopilotFocus,
              ClinicalStageStatus,
              StageName,
              StageState,
          )
          from app.modules.clinical_copilot.service import (
              ClinicalCopilotInputError,
              ClinicalCopilotService,
              _digest,
          )


          class ExplodingService(ClinicalCopilotService):
              async def build_context(self, **_kwargs):
                  raise AssertionError("invalid focus must fail before context work")


          class ReadyService(ClinicalCopilotService):
              def __init__(self, context):
                  super().__init__(db=None)
                  self.context = context

              async def build_context(self, **_kwargs):
                  return self.context


          class AliasProvider:
              def __init__(self):
                  self.last_user_text = None
                  self.called = False

              def complete(self, *, system, messages, tools, model, max_tokens):
                  self.called = True
                  self.last_user_text = messages[0].content[0].text
                  payload = json.loads(self.last_user_text)

                  async def stream():
                      yield TextDelta(
                          text=json.dumps(
                              {
                                  "claims": [
                                      {
                                          "text": "Grounded advisory.",
                                          "evidence_ids": [payload["allowed_evidence_ids"][0]],
                                      }
                                  ],
                                  "limitations": [],
                              }
                          )
                      )
                      yield Done(stop_reason="stop")

                  return stream()


          @pytest.mark.asyncio
          async def test_internal_free_text_focus_fails_before_context_or_provider() -> None:
              provider = AliasProvider()
              service = ExplodingService(db=None)
              with pytest.raises(ClinicalCopilotInputError, match="focus_invalid"):
                  await service.advise(
                      clinic_id=uuid4(),
                      patient_id=uuid4(),
                      focus="patient free text",
                      provider=provider,
                      provider_name="fake",
                      model="fake-model",
                      user_id=uuid4(),
                      user_role="dentist",
                  )
              assert provider.called is False


          @pytest.mark.asyncio
          async def test_alias_boundary_and_exact_provider_input_digest() -> None:
              patient_id = uuid4()
              context = ClinicalCopilotContext(
                  clinic_id=uuid4(),
                  patient_id=patient_id,
                  stages=[
                      ClinicalStageStatus(
                          stage=StageName.CASE_INTELLIGENCE,
                          state=StageState.READY,
                          artifact_id="internal-artifact-id",
                          source_digest="sha256:internal-stage-digest",
                          evidence_refs=["RAW-EVIDENCE-1"],
                      )
                  ],
                  missing_or_stale=[],
                  evidence_catalog={
                      "case_intelligence": {
                          "artifact_id": "internal-artifact-id",
                          "source_digest": "sha256:internal-catalog-digest",
                          "patient_id": str(patient_id),
                          "evidence": [{"evidence_id": "RAW-EVIDENCE-1"}],
                      }
                  },
                  input_digest="sha256:internal-context-digest",
                  ready_for_advice=True,
              )
              provider = AliasProvider()
              result = await ReadyService(context).advise(
                  clinic_id=context.clinic_id,
                  patient_id=patient_id,
                  focus=ClinicalCopilotFocus.CASE_REVIEW,
                  provider=provider,
                  provider_name="fake",
                  model="fake-model",
                  user_id=uuid4(),
                  user_role="dentist",
              )
              payload = json.loads(provider.last_user_text)
              assert payload["allowed_evidence_ids"] == ["E001"]
              assert payload["evidence_chain"]["case_intelligence"]["evidence"] == [
                  {"evidence_id": "E001"}
              ]
              assert "RAW-EVIDENCE-1" not in provider.last_user_text
              assert "internal-artifact-id" not in provider.last_user_text
              assert "internal-catalog-digest" not in provider.last_user_text
              assert str(patient_id) not in provider.last_user_text
              assert result.claims[0].evidence_ids == ["RAW-EVIDENCE-1"]
              assert result.provenance.input_digest == _digest(payload)
              assert result.provenance.input_digest != context.input_digest
              assert result.provenance.provider_contract_version == "core.llm.Provider/1"
              assert result.provenance.prompt_version == "1.0"
              assert result.provenance.input_contract_version == "1.0"
          ''')
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Format changed Python
        run: ruff format backend/app/modules/clinical_copilot/contracts.py backend/app/modules/clinical_copilot/service.py backend/tests/modules/clinical_copilot/test_service.py backend/tests/modules/clinical_copilot/test_hardening.py

      - name: Validate focused hardening
        run: |
          ruff check backend/app/modules/clinical_copilot backend/tests/modules/clinical_copilot
          ruff format --check backend/app/modules/clinical_copilot backend/tests/modules/clinical_copilot
          cd backend
          python -m pytest tests/modules/clinical_copilot -v --tb=short
          cd ..
          git diff --check

      - name: Commit hardening
        run: |
          git fetch origin phase/clinical-copilot
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/phase/clinical-copilot)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/clinical_copilot/contracts.py backend/app/modules/clinical_copilot/service.py backend/tests/modules/clinical_copilot/test_service.py backend/tests/modules/clinical_copilot/test_hardening.py
          git commit -m "fix(clinical-copilot): harden provider boundary provenance"
          git push origin HEAD:phase/clinical-copilot
