name: Clinical Copilot Remediation

on:
  push:
    branches:
      - phase/clinical-copilot
    paths:
      - .github/workflows/clinical-copilot-remediation.yml

permissions:
  contents: write

jobs:
  regenerate-catalogs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/clinical-copilot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate catalogs with the official generator
        run: |
          python backend/scripts/generate_catalogs.py
          python backend/scripts/generate_catalogs.py --check
      - name: Commit generated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/modules-catalog.md docs/events-catalog.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(clinical-copilot): regenerate catalogs'
          git push origin HEAD:phase/clinical-copilot
