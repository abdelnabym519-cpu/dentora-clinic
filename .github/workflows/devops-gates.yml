name: DevOps Gates

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  declarative-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: dentora-devops-ci-db
      SECRET_KEY: dentora-devops-ci-secret
      BUDGET_PUBLIC_SECRET_KEY: dentora-devops-ci-budget
      PUBLIC_URL: https://dentora-ci.invalid
      DENTORA_VERSION: 2.0.0
      MINIO_ROOT_PASSWORD: dentora-devops-ci-minio
      S3_BUCKET: dentora-ci
      S3_ACCESS_KEY: dentora-ci
      S3_SECRET_KEY: dentora-ci-secret
      DENTORA_POSTGRES_VOLUME: dentora-ci-pgdata
      DENTORA_STORAGE_VOLUME: dentora-ci-storage
      DENTORA_CADDY_DATA_VOLUME: dentora-ci-caddy-data
      DENTORA_CADDY_CONFIG_VOLUME: dentora-ci-caddy-config
      BACKEND_FQDN: backend.dentora-ci.invalid
      BACKEND_URL: https://backend.dentora-ci.invalid
      FRONTEND_FQDN: frontend.dentora-ci.invalid
      FRONTEND_URL: https://frontend.dentora-ci.invalid
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate supported Compose models
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.s3.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.minio.yml config --quiet
          docker compose -f docker-compose.client.yml config --quiet
          docker compose -f docker-compose.client.yml -f docker-compose.client.existing-volumes.yml config --quiet
          docker compose -f docker-compose.client.yml -f docker-compose.s3.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.s3.yml config --quiet
          docker compose -f docker-compose.coolify.yml config --quiet
          docker compose -f docker-compose.coolify.yml -f docker-compose.s3.yml config --quiet

      - name: Validate fail-closed environment contracts
        run: |
          set -euo pipefail
          if (unset DENTORA_VERSION; docker compose -f docker-compose.prod.yml config --quiet >/dev/null 2>&1); then
            echo "::error::Production Compose accepted a missing DENTORA_VERSION"; exit 1
          fi
          if (unset BUDGET_PUBLIC_SECRET_KEY; docker compose -f docker-compose.prod.yml config --quiet >/dev/null 2>&1); then
            echo "::error::Production Compose accepted a missing BUDGET_PUBLIC_SECRET_KEY"; exit 1
          fi
          if (SECRET_KEY= docker compose -f docker-compose.coolify.yml config --quiet >/dev/null 2>&1); then
            echo "::error::Coolify Compose accepted an empty SECRET_KEY"; exit 1
          fi
          if (POSTGRES_PASSWORD= docker compose -f docker-compose.coolify.yml config --quiet >/dev/null 2>&1); then
            echo "::error::Coolify Compose accepted an empty POSTGRES_PASSWORD"; exit 1
          fi
          grep -qx 'DENTORA_VERSION=' .env.prod.example
          git check-ignore -q .env.client

      - name: Enforce immutable third-party Actions and no self-mutating workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          mutation_pattern=r'\bgit\s+(?:push|commit)\b'
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text=path.read_text()
              for lineno,line in enumerate(text.splitlines(),1):
                  m=re.search(r'\buses:\s*([^\s#]+)', line)
                  if not m: continue
                  value=m.group(1)
                  if value.startswith('./'): continue
                  if '@' not in value or not re.fullmatch(r'[0-9a-f]{40}', value.rsplit('@',1)[1]):
                      failures.append(f'{path}:{lineno}: {value}')
              if path.name != 'release.yml' and re.search(mutation_pattern, text):
                  failures.append(f'{path}: self-mutating git command')
          if failures:
              raise SystemExit('\n'.join(failures))
          if Path('.github/workflows/risk-remediation.yml').exists():
              raise SystemExit('legacy risk-remediation workflow still exists')
          PY

  runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INITIAL_STORAGE_VOLUME: dentora-phase8-${{ github.run_id }}-${{ github.run_attempt }}-storage
      RUNTIME_ROOT: /tmp/dentora-phase8-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create isolated client configuration
        run: |
          cp .env.client.example .env.client
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('.env.client')
          values={
            'PUBLIC_URL':'http://localhost',
            'POSTGRES_DB':'dental_clinic',
            'POSTGRES_USER':'dental',
            'POSTGRES_PASSWORD':'dentora-phase8-db',
            'SECRET_KEY':'dentora-phase8-secret-key',
            'BUDGET_PUBLIC_SECRET_KEY':'dentora-phase8-budget-secret',
            'DENTORA_POSTGRES_VOLUME':f"dentora-phase8-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-pg",
            'DENTORA_STORAGE_VOLUME':os.environ['INITIAL_STORAGE_VOLUME'],
            'DENTORA_CADDY_DATA_VOLUME':f"dentora-phase8-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-caddy-data",
            'DENTORA_CADDY_CONFIG_VOLUME':f"dentora-phase8-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-caddy-config",
            'LICENSE_SERVER_URL':'', 'LICENSE_PUBLIC_KEY_B64':'',
            'LICENSE_MACHINE_FINGERPRINT':'phase8-runtime', 'AI_GATEWAY_BASE_URL':'',
            'UPDATE_METADATA_URL':'https://localhost:9443/update.json', 'UPDATE_PUBLIC_KEY_B64':'',
          }
          lines=p.read_text().splitlines()
          for key,value in values.items():
              for i,line in enumerate(lines):
                  if line.startswith(key+'='):
                      lines[i]=f'{key}={value}'; break
              else: lines.append(f'{key}={value}')
          p.write_text('\n'.join(lines)+'\n')
          PY

      - name: Boot client runtime and wait for readiness
        run: |
          set -euo pipefail
          docker compose --env-file .env.client -f docker-compose.client.yml up -d --build db backend frontend caddy
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file .env.client -f docker-compose.client.yml ps
          docker compose --env-file .env.client -f docker-compose.client.yml logs backend
          exit 1

      - name: Create preservation sentinels
        run: |
          set -euo pipefail
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T db \
            psql -U dental -d dental_clinic -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE devops_phase8_sentinel (id integer primary key, value text not null); INSERT INTO devops_phase8_sentinel VALUES (1,'before');"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T backend \
            sh -c "printf 'before\n' > /app/storage/devops-phase8-sentinel.txt"

      - name: Runtime backup, mutation and transactional restore
        run: |
          set -euo pipefail
          sudo -E pwsh -NoProfile -File scripts/dentora_backup_restore.ps1 -Action backup | tee /tmp/phase8-backup.log
          artifact=$(sed -n 's/^Artifact: //p' /tmp/phase8-backup.log | tr -d '\r' | tail -1)
          test -n "$artifact" && sudo test -f "$artifact"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T db \
            psql -U dental -d dental_clinic -v ON_ERROR_STOP=1 -c \
            "UPDATE devops_phase8_sentinel SET value='mutated' WHERE id=1;"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T backend \
            sh -c "printf 'mutated\n' > /app/storage/devops-phase8-sentinel.txt"
          sudo -E pwsh -NoProfile -File scripts/dentora_backup_restore.ps1 -Action restore -ArtifactPath "$artifact"
          value=$(docker compose --env-file .env.client -f docker-compose.client.yml exec -T db \
            psql -U dental -d dental_clinic -Atc "SELECT value FROM devops_phase8_sentinel WHERE id=1;")
          test "$value" = "before"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T backend \
            sh -c 'test "$(cat /app/storage/devops-phase8-sentinel.txt)" = before'
          curl -fsS http://localhost/health/ready >/dev/null

      - name: Prepare trusted local HTTPS update channel
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_ROOT/www" "$RUNTIME_ROOT/signing"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$RUNTIME_ROOT/server.key" -out "$RUNTIME_ROOT/server.crt" \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          sudo cp "$RUNTIME_ROOT/server.crt" /usr/local/share/ca-certificates/dentora-phase8.crt
          sudo update-ca-certificates
          cat > "$RUNTIME_ROOT/serve.py" <<'PY'
          import http.server, ssl, os
          os.chdir(os.environ['RUNTIME_ROOT'] + '/www')
          server=http.server.ThreadingHTTPServer(('127.0.0.1',9443), http.server.SimpleHTTPRequestHandler)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(os.environ['RUNTIME_ROOT']+'/server.crt', os.environ['RUNTIME_ROOT']+'/server.key')
          server.socket=ctx.wrap_socket(server.socket,server_side=True)
          server.serve_forever()
          PY
          nohup python3 "$RUNTIME_ROOT/serve.py" >/tmp/dentora-update-https.log 2>&1 &
          for i in $(seq 1 20); do if curl -fsS https://localhost:9443/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/dentora-update-https.log; exit 1

      - name: Create update signing key and package helper
        run: |
          set -euo pipefail
          docker compose --env-file .env.client -f docker-compose.client.yml run --rm --no-deps \
            --user 0:0 -v "$RUNTIME_ROOT/signing:/proof" --entrypoint python backend - <<'PY'
          import base64
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key=Ed25519PrivateKey.generate()
          Path('/proof/private.bin').write_bytes(key.private_bytes(serialization.Encoding.Raw, serialization.PrivateFormat.Raw, serialization.NoEncryption()))
          public=key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          Path('/proof/public.b64').write_text(base64.b64encode(public).decode())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('.env.client'); value=Path(os.environ['RUNTIME_ROOT']+'/signing/public.b64').read_text().strip()
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('UPDATE_PUBLIC_KEY_B64='):
                  lines[i]='UPDATE_PUBLIC_KEY_B64='+value; break
          p.write_text('\n'.join(lines)+'\n')
          PY
          cat > "$RUNTIME_ROOT/make-update.py" <<'PY'
          import base64, hashlib, json, os, re, shutil, subprocess, sys, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          root=Path(os.environ['GITHUB_WORKSPACE']); runtime=Path(os.environ['RUNTIME_ROOT'])
          target=sys.argv[1]; compatible=sys.argv[2]; broken=(len(sys.argv)>3 and sys.argv[3]=='broken')
          stage=runtime/'stage'; shutil.rmtree(stage,ignore_errors=True); stage.mkdir(parents=True)
          excludes={'.git','.env.client','backups','.dentora-update-journal.json','.dentora-restore-journal.json'}
          for item in root.iterdir():
              if item.name in excludes: continue
              dest=stage/item.name
              shutil.copytree(item,dest,symlinks=True) if item.is_dir() else shutil.copy2(item,dest)
          pyproject=stage/'backend/pyproject.toml'; text=pyproject.read_text()
          marker=f'version = "{compatible}"'
          if marker not in text: raise SystemExit(f'installed version marker not found: {marker}')
          pyproject.write_text(text.replace(marker,f'version = "{target}"',1))
          if broken:
              dockerfile=stage/'frontend/Dockerfile.prod'; dockerfile.write_text(dockerfile.read_text()+'\nRUN exit 42\n')
          package=runtime/'www/dentora-update.zip'; package.unlink(missing_ok=True)
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as z:
              for path in stage.rglob('*'):
                  if path.is_file(): z.write(path,path.relative_to(stage))
          payload=package.read_bytes()
          schema=subprocess.check_output(['docker','compose','--env-file',str(root/'.env.client'),'-f',str(root/'docker-compose.client.yml'),'run','--rm','--no-deps','--entrypoint','alembic','backend','heads'],text=True)
          heads=sorted({line.split()[0] for line in schema.splitlines() if re.search(r'\((?:effective )?head\)\s*$', line)})
          if not heads or any(not re.fullmatch(r'[A-Za-z0-9_-]{4,128}', head) for head in heads):
              raise SystemExit(f'invalid Alembic head set: {heads}')
          schema_revision='heads-'+hashlib.sha256('\n'.join(heads).encode()).hexdigest()
          descriptor={'version':target,'compatible_from':compatible,'package_url':'https://localhost:9443/dentora-update.zip','sha256':hashlib.sha256(payload).hexdigest(),'size':len(payload),'schema_revision':schema_revision,'requires_backup':True}
          canonical=json.dumps(descriptor,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          key=Ed25519PrivateKey.from_private_bytes((runtime/'signing/private.bin').read_bytes())
          (runtime/'www/update.json').write_text(json.dumps({'descriptor':descriptor,'signature':base64.b64encode(key.sign(canonical)).decode()},separators=(',',':')))
          PY

      - name: Apply signed HTTPS update and verify preserved runtime state
        run: |
          set -euo pipefail
          docker compose --env-file .env.client -f docker-compose.client.yml run --rm --no-deps \
            --user 0:0 -v "$RUNTIME_ROOT:/runtime" -v "$GITHUB_WORKSPACE:/workspace" --entrypoint sh backend -c \
            'cd /workspace && RUNTIME_ROOT=/runtime GITHUB_WORKSPACE=/workspace python /runtime/make-update.py 2.0.1 2.0.0'
          curl -fsS https://localhost:9443/update.json >/dev/null
          sudo -E pwsh -NoProfile -File scripts/dentora_auto_update.ps1 -Action apply
          grep -q '^version = "2.0.1"$' backend/pyproject.toml
          value=$(docker compose --env-file .env.client -f docker-compose.client.yml exec -T db psql -U dental -d dental_clinic -Atc "SELECT value FROM devops_phase8_sentinel WHERE id=1;")
          test "$value" = "before"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T backend sh -c 'test "$(cat /app/storage/devops-phase8-sentinel.txt)" = before'
          test ! -e .dentora-update-journal.json
          curl -fsS http://localhost/health/ready >/dev/null

      - name: Prove failed signed update rolls back transactionally
        run: |
          set -euo pipefail
          docker compose --env-file .env.client -f docker-compose.client.yml run --rm --no-deps \
            --user 0:0 -v "$RUNTIME_ROOT:/runtime" -v "$GITHUB_WORKSPACE:/workspace" --entrypoint sh backend -c \
            'cd /workspace && RUNTIME_ROOT=/runtime GITHUB_WORKSPACE=/workspace python /runtime/make-update.py 2.0.2 2.0.1 broken'
          set +e
          sudo -E pwsh -NoProfile -File scripts/dentora_auto_update.ps1 -Action apply >/tmp/phase8-failed-update.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '^version = "2.0.1"$' backend/pyproject.toml
          test ! -e .dentora-update-journal.json
          value=$(docker compose --env-file .env.client -f docker-compose.client.yml exec -T db psql -U dental -d dental_clinic -Atc "SELECT value FROM devops_phase8_sentinel WHERE id=1;")
          test "$value" = "before"
          docker compose --env-file .env.client -f docker-compose.client.yml exec -T backend sh -c 'test "$(cat /app/storage/devops-phase8-sentinel.txt)" = before'
          curl -fsS http://localhost/health/ready >/dev/null
          cat /tmp/phase8-failed-update.log

      - name: Show runtime diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.client -f docker-compose.client.yml ps || true
          docker compose --env-file .env.client -f docker-compose.client.yml logs --tail=200 || true
          cat /tmp/dentora-update-https.log 2>/dev/null || true

      - name: Clean runtime
        if: always()
        run: |
          docker compose --env-file .env.client -f docker-compose.client.yml down -v --remove-orphans || true
          docker volume ls -q --filter label=dentora.role=restore-storage | xargs -r docker volume rm || true
