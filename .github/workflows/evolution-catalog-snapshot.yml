name: Evolution catalog snapshot

on:
  push:
    branches: [feature/evolution-whatsapp]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Generate catalogs
        run: python backend/scripts/generate_catalogs.py
        env:
          DATABASE_URL: postgresql+asyncpg://stub:stub@localhost:5432/stub
          SECRET_KEY: catalog-snapshot-stub-key-32chars-minimum
          ENVIRONMENT: test
          TESTING: "true"

      - name: Upload generated catalogs
        uses: actions/upload-artifact@v5
        with:
          name: evolution-generated-catalogs
          path: |
            docs/modules-catalog.md
            docs/events-catalog.md
          retention-days: 1
