name: Evolution Ruff Catalog Helper

on:
  push:
    branches: [helper/evolution-ruff-catalog]
    paths:
      - .github/workflows/evolution-ruff-catalog-helper.yml

permissions:
  contents: write

jobs:
  format-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: helper/evolution-ruff-catalog

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Apply official Ruff formatter to WhatsApp scope
        run: |
          ruff format \
            backend/app/modules/notifications/gateway.py \
            backend/app/modules/whatsapp_evolution/adapter.py \
            backend/app/modules/whatsapp_evolution/client.py \
            backend/app/modules/whatsapp_evolution/migrations/versions/wae_0001_initial.py \
            backend/app/modules/whatsapp_evolution/router.py \
            backend/app/modules/whatsapp_evolution/service.py \
            backend/app/modules/whatsapp_evolution/webhooks.py \
            backend/tests/modules/whatsapp_evolution/test_webhook.py
          ruff check backend/
          ruff format --check backend/

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerate official catalogs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: |
          python scripts/generate_catalogs.py
          python scripts/generate_catalogs.py --check

      - name: Commit helper output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/notifications/gateway.py \
            backend/app/modules/whatsapp_evolution/adapter.py \
            backend/app/modules/whatsapp_evolution/client.py \
            backend/app/modules/whatsapp_evolution/migrations/versions/wae_0001_initial.py \
            backend/app/modules/whatsapp_evolution/router.py \
            backend/app/modules/whatsapp_evolution/service.py \
            backend/app/modules/whatsapp_evolution/webhooks.py \
            backend/tests/modules/whatsapp_evolution/test_webhook.py \
            docs/modules-catalog.md \
            docs/events-catalog.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture official Ruff and catalog output"
          git push origin HEAD:helper/evolution-ruff-catalog
