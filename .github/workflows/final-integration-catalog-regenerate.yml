name: Final Integration Catalog Regeneration

on:
  push:
    branches: [phase/final-dental-digital-twin-integration]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/final-dental-digital-twin-integration

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerate canonical catalogs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py

      - name: Commit generated catalogs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules-catalog.md docs/events-catalog.md
          if git diff --cached --quiet; then
            echo "Catalogs already fresh"
            exit 0
          fi
          git commit -m "docs(integration): regenerate canonical catalogs"
          git push origin HEAD:phase/final-dental-digital-twin-integration
