name: Images health

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

env:
  ISSUE_TITLE: "Published images are not pullable"
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest Release manifest, checksum and immutable images
        run: |
          set -euo pipefail
          mkdir -p /tmp/dentora-health
          release=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")
          manifest_url=$(jq -r '.assets[] | select(.name=="dentora-release-manifest.json") | .browser_download_url' <<<"$release")
          checksum_url=$(jq -r '.assets[] | select(.name=="dentora-release-manifest.json.sha256") | .browser_download_url' <<<"$release")
          test -n "$manifest_url" && test "$manifest_url" != null
          test -n "$checksum_url" && test "$checksum_url" != null
          curl -fsSL "$manifest_url" -o /tmp/dentora-health/dentora-release-manifest.json
          curl -fsSL "$checksum_url" -o /tmp/dentora-health/dentora-release-manifest.json.sha256
          (cd /tmp/dentora-health && sha256sum -c dentora-release-manifest.json.sha256)

          fail=0
          for image in backend frontend; do
            ref=$(jq -r --arg image "$image" '.images[$image]' /tmp/dentora-health/dentora-release-manifest.json)
            expected="ghcr.io/${GITHUB_REPOSITORY}-${image}"
            if [[ ! "$ref" =~ ^${expected}(:[^@]+)?@sha256:[0-9a-f]{64}$ ]]; then
              echo "FAIL unauthorized or mutable image reference for $image: $ref"
              fail=1
              continue
            fi
            if ! manifest=$(docker manifest inspect "$ref" 2>&1); then
              echo "FAIL $ref cannot be pulled anonymously"
              echo "$manifest" | head -3
              fail=1
              continue
            fi
            for arch in amd64 arm64; do
              if echo "$manifest" | jq -e --arg a "$arch" \
                '[.manifests[]?.platform | select(.os == "linux" and .architecture == $a)] | length > 0' >/dev/null; then
                echo "ok $ref has linux/$arch"
              else
                echo "FAIL $ref is missing linux/$arch"
                fail=1
              fi
            done
          done
          exit $fail

  alert:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$ISSUE_TITLE" --label bug --body \
          "The latest published Release manifest/checksum or its immutable container digests failed validation, could not be pulled anonymously, or are missing an architecture.

          Logs: $RUN_URL

          This issue closes itself on the next green check."

  resolve:
    needs: check
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the alert issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Release manifest and immutable images healthy again as of $(date -u +'%Y-%m-%d %H:%M UTC')."
          fi
