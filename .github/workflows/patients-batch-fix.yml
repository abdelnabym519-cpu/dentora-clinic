name: Patients batch fix

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.ref == 'refactor/clean-architecture-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/clean-architecture-foundation

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Apply Patients integration fix and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router_path = Path('backend/app/modules/patients_clinical/router.py')
          text = router_path.read_text(encoding='utf-8')

          old_import = 'from app.modules.patients.service import PatientService\n'
          new_import = (
              'from app.modules.patients.event_publisher import EventBusPatientEventPublisher\n'
              'from app.modules.patients.repository import SqlAlchemyPatientRepository\n'
              'from app.modules.patients.service import PatientService\n'
          )
          if old_import not in text:
              raise SystemExit('Expected PatientService import not found; refusing unsafe patch')
          text = text.replace(old_import, new_import, 1)

          old_lookup = '''async def _ensure_patient(db: AsyncSession, clinic_id: UUID, patient_id: UUID) -> None:\n    patient = await PatientService.get_patient(db, clinic_id, patient_id)\n    if patient is None:\n        raise HTTPException(status_code=status.HTTP_404_NOT_FOUND, detail="Patient not found")\n'''
          new_lookup = '''async def _ensure_patient(db: AsyncSession, clinic_id: UUID, patient_id: UUID) -> None:\n    patient_service = PatientService(\n        SqlAlchemyPatientRepository(db),\n        EventBusPatientEventPublisher(),\n    )\n    patient = await patient_service.get_patient(clinic_id, patient_id)\n    if patient is None:\n        raise HTTPException(status_code=status.HTTP_404_NOT_FOUND, detail="Patient not found")\n'''
          if old_lookup not in text:
              raise SystemExit('Expected legacy PatientService call not found; refusing unsafe patch')
          text = text.replace(old_lookup, new_lookup, 1)
          router_path.write_text(text, encoding='utf-8')

          test_path = Path('backend/tests/modules/patients/test_clinical_integration.py')
          if test_path.exists():
              raise SystemExit(f'{test_path} already exists; refusing overwrite')
          test_path.write_text(
              '''"""Regression coverage for Patients consumers outside the migrated module."""\n\nfrom unittest.mock import MagicMock\nfrom uuid import uuid4\n\nimport pytest\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom app.modules.patients.service import PatientService\nfrom app.modules.patients_clinical.router import _ensure_patient\n\n\n@pytest.mark.asyncio\nasync def test_clinical_patient_guard_uses_injected_patient_service(monkeypatch) -> None:\n    """Clinical routes must call the instance-based Patients application service."""\n    db = MagicMock(spec=AsyncSession)\n    clinic_id = uuid4()\n    patient_id = uuid4()\n    seen: dict[str, object] = {}\n\n    async def fake_get_patient(\n        self: PatientService, actual_clinic_id, actual_patient_id\n    ) -> object:\n        seen["service"] = self\n        seen["clinic_id"] = actual_clinic_id\n        seen["patient_id"] = actual_patient_id\n        return object()\n\n    monkeypatch.setattr(PatientService, "get_patient", fake_get_patient)\n\n    await _ensure_patient(db, clinic_id, patient_id)\n\n    assert isinstance(seen["service"], PatientService)\n    assert seen["clinic_id"] == clinic_id\n    assert seen["patient_id"] == patient_id\n''',
              encoding='utf-8',
          )
          PY

      - name: Install backend validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'

      - name: Regenerate catalogs canonically
        run: python backend/scripts/generate_catalogs.py

      - name: Run Patients validation
        env:
          DATABASE_URL: postgresql+asyncpg://stub:stub@localhost:5432/stub
          SECRET_KEY: patients-batch-validation-secret-key
          ENVIRONMENT: test
          TESTING: 'true'
        run: |
          python -m pytest backend/tests/modules/patients -q
          python -m ruff check backend/app/modules/patients backend/app/modules/patients_clinical/router.py backend/tests/modules/patients
          python -m ruff format --check backend/app/modules/patients backend/app/modules/patients_clinical/router.py backend/tests/modules/patients
          python backend/scripts/generate_catalogs.py --check

      - name: Commit validated batch and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patients-batch-fix.yml
          git add backend/app/modules/patients_clinical/router.py \
                  backend/tests/modules/patients/test_clinical_integration.py \
                  docs/events-catalog.md docs/modules-catalog.md
          git diff --cached --check
          git commit -m 'fix: restore patients clinical integration'
          git push origin HEAD:refactor/clean-architecture-foundation
