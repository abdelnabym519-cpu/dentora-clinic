name: Regenerate catalogs (temporary)

on:
  push:
    branches:
      - feat/prescription-whatsapp-production

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/prescription-whatsapp-production

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerate catalogs
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
          SECRET_KEY: ci-stub
          ENVIRONMENT: test
          TESTING: "true"
        run: python scripts/generate_catalogs.py

      - name: Commit generated catalogs
        shell: bash
        run: |
          if git diff --quiet -- docs/modules-catalog.md docs/events-catalog.md; then
            echo "Catalogs already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs: regenerate module catalogs"
          git push origin HEAD:feat/prescription-whatsapp-production
