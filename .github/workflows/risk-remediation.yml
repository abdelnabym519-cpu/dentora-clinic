name: Risk Remediation

on:
  push:
    branches:
      - codex/phase-5-dentora
    paths:
      - .github/workflows/risk-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/phase-5-dentora
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Format risk files and regenerate catalogs
        run: |
          ruff format backend/app/modules/risk_engine/engine.py \
            backend/app/modules/risk_engine/migrations/versions/risk_0001_risk_results.py \
            backend/tests/modules/risk_engine/test_engine.py
          python backend/scripts/generate_catalogs.py
          ruff check backend/
          ruff format --check backend/
          python backend/scripts/generate_catalogs.py --check
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/risk_engine/engine.py \
            backend/app/modules/risk_engine/migrations/versions/risk_0001_risk_results.py \
            backend/tests/modules/risk_engine/test_engine.py \
            docs/modules-catalog.md docs/events-catalog.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(risk): format and regenerate catalogs'
          git push origin HEAD:codex/phase-5-dentora
