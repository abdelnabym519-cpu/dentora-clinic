name: AI Treatment Planning Validation

on:
  push:
    branches:
      - codex/phase-5-dentora
    paths:
      - .github/workflows/risk-remediation.yml

permissions:
  contents: write

# Validation retry after correcting the privacy assertion to inspect forbidden fields.
jobs:
  validate-and-fix:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: test-secret-key-for-ai-treatment-planning
      ENVIRONMENT: test
      TESTING: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/phase-5-dentora
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Format and regenerate catalogs
        run: |
          ruff format backend/app/modules/ai_treatment_planning backend/tests/modules/ai_treatment_planning
          python backend/scripts/generate_catalogs.py
          ruff check backend/
          ruff format --check backend/
          python backend/scripts/generate_catalogs.py --check
      - name: AI Treatment Planning validation
        working-directory: backend
        run: |
          python -m pytest tests/modules/ai_treatment_planning -v --tb=short
          python -m pytest tests/test_alembic_branches.py tests/test_module_docs.py tests/test_module_manifests_consistency.py -v --tb=short
          python -m pytest -m alembic_roundtrip tests/test_alembic_roundtrip.py -v --tb=short
      - name: Commit validated formatting and catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/ai_treatment_planning \
            backend/tests/modules/ai_treatment_planning \
            backend/pyproject.toml \
            docs/modules-catalog.md docs/events-catalog.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ai): validate treatment planning stage'
          git push origin HEAD:codex/phase-5-dentora
