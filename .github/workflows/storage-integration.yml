name: Storage Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  snapshot-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: change-detection-storage-ci
      ENVIRONMENT: test
      TESTING: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase/change-detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Regenerate catalogs with official generator
        run: python backend/scripts/generate_catalogs.py

      - name: Commit regenerated catalogs
        run: |
          if git diff --quiet -- docs/modules-catalog.md docs/events-catalog.md; then
            echo "Catalogs already fresh"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/modules-catalog.md docs/events-catalog.md
          git commit -m "docs(change-detection): regenerate module catalogs"
          git push origin HEAD:phase/change-detection

      - name: Run persisted snapshot integration test
        working-directory: backend
        run: >-
          python -m pytest
          tests/modules/dental_3d/test_change_detection.py::test_persisted_snapshots_are_compared_with_tenant_scope
          -v --tb=short
