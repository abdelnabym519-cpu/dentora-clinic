name: Storage Integration

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  minio-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/stub
      POSTGRES_PASSWORD: storage-compose-ci
      SECRET_KEY: storage-integration-ci
      BUDGET_PUBLIC_SECRET_KEY: storage-budget-ci
      ENVIRONMENT: test
      TESTING: "true"
      RUN_S3_INTEGRATION: "1"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: dentora-media-ci
      S3_ACCESS_KEY: dentora-ci
      S3_SECRET_KEY: dentora-ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_PREFIX: dentora-ci
      S3_ADDRESSING_STYLE: path
      S3_PRESIGN_EXPIRY_SECONDS: "300"
      S3_MULTIPART_THRESHOLD_BYTES: "5242880"
      S3_MULTIPART_PART_SIZE_BYTES: "5242880"
      MINIO_ROOT_USER: dentora-ci
      MINIO_ROOT_PASSWORD: dentora-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate S3 and MinIO compose overlays
        run: |
          docker compose -f docker-compose.yml -f docker-compose.s3.yml config --quiet
          docker compose -f docker-compose.client.yml -f docker-compose.s3.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.minio.yml config --quiet

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Start private MinIO
        run: |
          docker run -d --name dentora-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs dentora-minio
          exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run S3/MinIO integration test
        working-directory: backend
        run: python -m pytest tests/modules/media/test_s3_minio_integration.py -v --tb=short

      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs dentora-minio

  snapshot-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_clinic_test
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://dental:testpass@localhost:5432/dental_clinic_test
      SECRET_KEY: change-detection-storage-ci
      ENVIRONMENT: test
      TESTING: "true"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run persisted snapshot integration test
        working-directory: backend
        run: >-
          python -m pytest
          tests/modules/dental_3d/test_change_detection.py::test_persisted_snapshots_are_compared_with_tenant_scope
          -v --tb=short
