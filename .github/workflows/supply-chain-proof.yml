name: Supply Chain Proof

on:
  pull_request:
    branches: [main, develop]

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile.prod
            arch: amd64
            runner: ubuntu-latest
          - name: frontend
            context: .
            dockerfile: ./frontend/Dockerfile.prod
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=phase8-${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=phase8-${{ matrix.name }}-${{ matrix.arch }}
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.name }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: phase8-digest-${{ matrix.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 7

  merge-attest-proof:
    needs: build-proof
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phase8-digest-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        env:
          PROOF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.name }}"
          TAG="devops-proof-${PROOF_SHA}"
          SOURCES=""
          for f in /tmp/digests/${{ matrix.name }}-*; do SOURCES="$SOURCES ${IMAGE}@$(cat "$f")"; done
          mkdir -p /tmp/final
          # shellcheck disable=SC2086
          docker buildx imagetools create -t "${IMAGE}:${TAG}" --metadata-file /tmp/final/metadata.json $SOURCES
          DIGEST=$(jq -r '."containerimage.descriptor".digest' /tmp/final/metadata.json)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$DIGEST" > "/tmp/final/${{ matrix.name }}.digest"
      - name: Verify supported architectures, SBOM and provenance
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.name }}@${{ steps.merge.outputs.digest }}"
          raw=$(docker buildx imagetools inspect "$IMAGE" --raw)
          if [ "${{ matrix.name }}" = backend ]; then arches="amd64"; else arches="amd64 arm64"; fi
          for arch in $arches; do
            echo "$raw" | jq -e --arg a "$arch" '[.manifests[]?.platform | select(.os=="linux" and .architecture==$a)] | length > 0' >/dev/null
            if [ "${{ matrix.name }}" = backend ]; then
              # A one-platform index exposes attestation stubs directly. A
              # multi-platform index exposes them as platform-keyed maps.
              docker buildx imagetools inspect "$IMAGE" --format "{{json .SBOM}}" | jq -e 'type=="object" and length>0' >/dev/null
              docker buildx imagetools inspect "$IMAGE" --format "{{json .Provenance}}" | jq -e 'type=="object" and length>0' >/dev/null
            else
              docker buildx imagetools inspect "$IMAGE" --format "{{json (index .SBOM \"linux/$arch\")}}" | jq -e 'type=="object" and length>0' >/dev/null
              docker buildx imagetools inspect "$IMAGE" --format "{{json (index .Provenance \"linux/$arch\")}}" | jq -e 'type=="object" and length>0' >/dev/null
            fi
          done
      - name: Create GitHub OCI attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      - name: Verify GitHub OCI attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh attestation verify
          oci://${REGISTRY}/${GITHUB_REPOSITORY}-${{ matrix.name }}@${{ steps.merge.outputs.digest }}
          -R ${GITHUB_REPOSITORY}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: phase8-final-${{ matrix.name }}
          path: /tmp/final/${{ matrix.name }}.digest
          retention-days: 7

  proof-manifest:
    needs: merge-attest-proof
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phase8-final-*
          path: /tmp/final
          merge-multiple: true
      - name: Create release-format proof manifest and checksum
        env:
          PROOF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          backend=$(cat /tmp/final/backend.digest)
          frontend=$(cat /tmp/final/frontend.digest)
          TAG="devops-proof-${PROOF_SHA}"
          mkdir -p proof
          jq -n \
            --arg sourceSha "$PROOF_SHA" --arg tag "$TAG" \
            --arg backend "${REGISTRY}/${GITHUB_REPOSITORY}-backend@$backend" \
            --arg frontend "${REGISTRY}/${GITHUB_REPOSITORY}-frontend@$frontend" \
            '{schema:2,kind:"devops-phase8-proof",sourceSha:$sourceSha,tag:$tag,images:{backend:$backend,frontend:$frontend},platforms:{backend:["linux/amd64"],frontend:["linux/amd64","linux/arm64"]},supplyChain:{sbom:true,provenance:true,githubAttestation:true}}' \
            > proof/dentora-release-manifest.json
          (cd proof && sha256sum dentora-release-manifest.json > dentora-release-manifest.json.sha256)
          (cd proof && sha256sum -c dentora-release-manifest.json.sha256)
          jq -e --arg sha "$PROOF_SHA" '.sourceSha==$sha and .supplyChain.sbom and .supplyChain.provenance and .supplyChain.githubAttestation' proof/dentora-release-manifest.json >/dev/null
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dentora-phase8-release-proof
          path: proof/
          retention-days: 14

  production-runtime:
    needs: [merge-attest-proof, proof-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dentora-phase8-release-proof
          path: /tmp/proof
      - name: Pull and boot production Compose anonymously
        env:
          PROOF_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="devops-proof-${PROOF_SHA}"
          cat > /tmp/dentora-prod.env <<EOF
          PUBLIC_URL=http://localhost
          DENTORA_VERSION=${TAG}
          POSTGRES_DB=dental_clinic
          POSTGRES_USER=dental
          POSTGRES_PASSWORD=dentora-phase8-prod-db
          SECRET_KEY=dentora-phase8-prod-secret
          BUDGET_PUBLIC_SECRET_KEY=dentora-phase8-prod-budget
          SEED_ON_STARTUP=0
          EOF
          # No docker login in this job: pullability is part of the proof.
          docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml pull
          docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml up -d
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost/health >/dev/null
          curl -fsS http://localhost/health/ready >/dev/null
          docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml exec -T backend alembic current --check-heads

      - name: Verify running OCI digests match proof manifest
        run: |
          set -euo pipefail
          for image in backend frontend; do
            expected=$(jq -r --arg i "$image" '.images[$i]' /tmp/proof/dentora-release-manifest.json)
            digest=${expected##*@}
            container=$(docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml ps -q "$image")
            actual=$(docker inspect "$container" --format '{{join .RepoDigests "\n"}}')
            echo "$actual" | grep -F "@$digest" >/dev/null
          done

      - name: Show production diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml ps || true
          docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml logs --tail=200 || true

      - name: Clean production runtime
        if: always()
        run: docker compose --env-file /tmp/dentora-prod.env -f docker-compose.prod.yml down -v --remove-orphans || true
