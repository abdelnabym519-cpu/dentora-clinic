services:
  backend:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET for object storage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-dentora}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      S3_PRESIGN_EXPIRY_SECONDS: ${S3_PRESIGN_EXPIRY_SECONDS:-900}
      S3_MULTIPART_THRESHOLD_BYTES: ${S3_MULTIPART_THRESHOLD_BYTES:-8388608}
      S3_MULTIPART_PART_SIZE_BYTES: ${S3_MULTIPART_PART_SIZE_BYTES:-8388608}
