[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dentora-license-server"
version = "0.1.0"
description = "Dentora commercial license and activation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "cryptography>=43.0",
]

[tool.setuptools.packages.find]
where = ["."]
